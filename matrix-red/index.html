<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Red Matrix Rain</title>
<style>
  :root { --bg: #000; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Red "digital rain". Deterministic (seeded) so frames can be captured
// identically: open with ?render to drive it via window.renderFrame().
(() => {
  const params = new URLSearchParams(location.search);
  const COLS = Number(params.get('cols')) || 30;      // columns across the screen
  const FPS = 30;
  const GLYPHS = 'ｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ012345789Z:・.=*+-<>¦｜';

  let seed = Number(params.get('seed')) || 1999;
  const rand = () => {                                // mulberry32
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const glyph = () => GLYPHS[(rand() * GLYPHS.length) | 0];

  // The simulation draws into an offscreen buffer (trails accumulate there);
  // each frame is copied to the screen with a vignette on top.
  const buf = document.createElement('canvas');
  const ctx = buf.getContext('2d', { alpha: false, willReadFrequently: true });
  const screen = document.getElementById('c');
  const sctx = screen.getContext('2d', { alpha: false });
  let W, H, size, rows, drops, vig;

  const newDrop = (col, spread) => ({
    col,
    y: -rand() * rows * spread,
    speed: 0.25 + rand() * 0.55,                      // cells per frame
    layer: rand() < 0.3 ? 0.55 : 1,                   // dimmer "far" drops add depth
    last: -1,
  });

  function setup(w, h) {
    W = buf.width = screen.width = w;
    H = buf.height = screen.height = h;
    size = Math.ceil(W / COLS);
    rows = Math.ceil(H / size) + 1;
    drops = [];
    for (let c = 0; c < COLS; c++) {
      drops.push(newDrop(c, 1.2));
      if (rand() < 0.35) drops.push(newDrop(c, 1.2)); // some columns carry two streams
    }
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = `${Math.round(size * 0.9)}px "IPAGothic", "Hiragino Sans", "MS Gothic", monospace`;
    vig = sctx.createRadialGradient(W / 2, H / 2, H * 0.22, W / 2, H / 2, H * 0.72);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.6)');
    for (let i = 0; i < 240; i++) step();             // pre-roll so the screen starts full
  }

  function cell(col, row, color, blur) {
    const y = row * size;
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000';
    ctx.fillRect(col * size, y, size, size);
    ctx.shadowColor = color;
    ctx.shadowBlur = blur;
    ctx.fillStyle = color;
    ctx.fillText(glyph(), col * size + size / 2, y);
  }

  function step() {
    // Fade everything a little: this is what leaves the glowing trails.
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(0,0,0,0.075)';
    ctx.fillRect(0, 0, W, H);

    // Glyphs flicker and swap inside existing trails.
    for (let i = 0; i < COLS * 0.6; i++) {
      const col = (rand() * COLS) | 0, row = (rand() * rows) | 0;
      const r = ctx.getImageData(col * size + size / 2, row * size + size / 2, 1, 1).data[0];
      if (r > 40) cell(col, row, `rgb(${Math.min(255, r + 40)},0,${r >> 3})`, 0);
    }

    for (const d of drops) {
      d.y += d.speed;
      const row = Math.floor(d.y);
      if (row !== d.last && row >= 0) {
        // Previous head cools to red; the new head is a hot pinkish white.
        if (d.last >= 0) cell(d.col, d.last, d.layer < 1 ? '#8a0010' : '#ff1a2e', size * 0.35 * d.layer);
        cell(d.col, row, d.layer < 1 ? '#ff5a6a' : '#ffe2e6', size * 0.9 * d.layer);
        d.last = row;
      }
      if (d.y > rows + rand() * rows * 0.5) Object.assign(d, newDrop(d.col, 0.6));
    }
  }

  function present() {
    sctx.drawImage(buf, 0, 0);
    sctx.fillStyle = vig;
    sctx.fillRect(0, 0, W, H);
  }

  if (params.has('render')) {
    // Fixed-size capture mode (default: iPhone 17 Pro Max, 1320×2868).
    const w = Number(params.get('w')) || 1320, h = Number(params.get('h')) || 2868;
    screen.style.width = w + 'px';
    screen.style.height = h + 'px';
    window.renderReady = document.fonts.load('40px "IPAGothic"').catch(() => {}).then(() => setup(w, h));
    window.renderFrame = () => { step(); present(); };
    return;
  }

  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const resize = () => setup(Math.round(innerWidth * dpr), Math.round(innerHeight * dpr));
  addEventListener('resize', resize);
  resize();

  let acc = 0, prev = performance.now();
  requestAnimationFrame(function loop(now) {
    acc += now - prev; prev = now;
    if (acc >= 1000 / FPS) { acc %= 1000 / FPS; step(); present(); }
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
