<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Red Matrix Rain</title>
<style>
  :root { --bg: #000; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Red "digital rain" as a pure function of the frame number: every stream's
// position and every glyph repeats exactly after LOOP frames, so the
// animation (and the rendered video) loops with no seam.
// Open with ?render to drive it via window.renderFrame(t).
(() => {
  const params = new URLSearchParams(location.search);
  const COLS = Number(params.get('cols')) || 30;      // columns across the screen
  const FPS = 30;
  const LOOP = 8 * FPS;                               // loop length in frames
  const SEED = Number(params.get('seed')) || 1999;
  const GLYPHS = 'ｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ012345789Z:・.=*+-<>¦｜';
  // Glyph swap intervals must divide LOOP so glyphs repeat with the loop.
  const SWAPS = [6, 8, 10, 12, 16, 20, 24, 30, 40, 48, 60, 80, 120, 240];

  const hash = (...n) => {                            // integers -> [0, 1)
    let h = SEED ^ 0x9E3779B9;
    for (const v of n) { h = Math.imul(h ^ v, 0x85EBCA6B); h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35); h ^= h >>> 16; }
    return (h >>> 0) / 4294967296;
  };

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W, H, size, rows, drops, vig;

  function setup(w, h) {
    W = canvas.width = w;
    H = canvas.height = h;
    size = Math.ceil(W / COLS);
    rows = Math.ceil(H / size) + 1;
    drops = [];
    for (let c = 0; c < COLS; c++) {
      const streams = hash(c, 1) < 0.4 ? 2 : 1;       // some columns carry two streams
      for (let s = 0; s < streams; s++) {
        const trail = 10 + Math.floor(hash(c, s, 2) * 22);
        // Cycle length in cells (an integer) and laps per loop (an integer)
        // make the stream land back where it started after LOOP frames.
        const cycle = rows + trail + Math.floor(hash(c, s, 3) * rows * 0.7);
        const laps = hash(c, s, 4) < 0.25 ? 2 : 1;
        drops.push({
          col: c, trail, cycle,
          speed: laps * cycle / LOOP,
          phase: hash(c, s, 5) * cycle,
          far: hash(c, s, 6) < 0.3,                   // dimmer "far" streams add depth
        });
      }
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = `${Math.round(size * 0.9)}px "IPAGothic", "Hiragino Sans", "MS Gothic", monospace`;
    vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.22, W / 2, H / 2, H * 0.72);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.6)');
  }

  function glyph(col, row, t) {
    const every = SWAPS[Math.floor(hash(col, row, 7) * SWAPS.length)];
    const off = Math.floor(hash(col, row, 8) * every);
    const k = Math.floor((t + off) / every) % (LOOP / every);
    return GLYPHS[Math.floor(hash(col, row, 9, k) * GLYPHS.length)];
  }

  function render(frame) {
    const t = ((frame % LOOP) + LOOP) % LOOP;
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    for (const d of drops) {
      const head = Math.floor((d.phase + t * d.speed) % d.cycle) - d.trail;
      const dim = d.far ? 0.5 : 1;
      for (let i = d.trail - 1; i >= 0; i--) {         // tail first, head on top
        const row = head - i;
        if (row < 0 || row >= rows) continue;
        const x = d.col * size + size / 2, y = row * size;
        // Per-cell shimmer that also repeats with the loop.
        const flick = 0.85 + 0.15 * hash(d.col, row, 10, Math.floor(t / 3) % (LOOP / 3));
        let color, blur = 0;
        if (i === 0) {
          color = d.far ? '#ff6070' : '#ffe6ea';
          blur = size * 0.9 * dim;
        } else {
          const f = Math.pow(1 - i / d.trail, 1.4) * dim * flick;
          const g = i === 1 ? 70 * dim : 0;           // hot orange-red just behind the head
          color = `rgb(${Math.round(255 * Math.min(1, f + 0.15))},${Math.round(g * f)},${Math.round(40 * f)})`;
          if (i < 4) blur = size * 0.4 * dim;
        }
        ctx.shadowColor = color;
        ctx.shadowBlur = blur;
        ctx.fillStyle = color;
        ctx.fillText(glyph(d.col, row, t), x, y);
      }
    }
    ctx.shadowBlur = 0;
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  }

  if (params.has('render')) {
    // Fixed-size capture mode (default: iPhone 17 Pro Max, 1320×2868).
    const w = Number(params.get('w')) || 1320, h = Number(params.get('h')) || 2868;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    window.LOOP_FRAMES = LOOP;
    window.renderReady = document.fonts.load('40px "IPAGothic"').catch(() => {}).then(() => setup(w, h));
    window.renderFrame = render;
    return;
  }

  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const resize = () => setup(Math.round(innerWidth * dpr), Math.round(innerHeight * dpr));
  addEventListener('resize', resize);
  resize();

  const start = performance.now();
  let last = -1;
  requestAnimationFrame(function loop(now) {
    const frame = Math.floor((now - start) / 1000 * FPS);
    if (frame !== last) { render(frame); last = frame; }
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
